
name: Build Cricket Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          mkdir -p /tmp/cricket_backup
          cp pubspec.yaml /tmp/cricket_backup/
          cp -r lib /tmp/cricket_backup/
          flutter create --platforms=android --project-name cricket_video_analyzer .
          cp /tmp/cricket_backup/pubspec.yaml .
          cp -r /tmp/cricket_backup/lib/. lib/

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cricket-Video-Analyzer-APK
          path: build/app/outputs/flutter-apk/app-release.apk
